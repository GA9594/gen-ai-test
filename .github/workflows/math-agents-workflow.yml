name: ZAS Math Agents

# The correlation id goes into the RUN NAME so the adapter can find this run by
# polling the API -- that is what removes the need for any callback into our
# network, and therefore the need for a self-hosted runner.
run-name: ZAS ${{ inputs.correlation_id || github.event.client_payload.correlation_id }}

on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: ZAS session / correlation id
        required: true
      num_a:
        description: First number
        required: true
        default: "7"
      num_b:
        description: Second number
        required: true
        default: "5"
  # Kept so the older callback-style broker still works.
  repository_dispatch:
    types: [zas-math-task]

jobs:
  math-agents:
    runs-on: ubuntu-latest
    env:
      ZAS_WORK_DIR: ${{ github.workspace }}/.zas_work
      ZAS_CORRELATION_ID: ${{ inputs.correlation_id || github.event.client_payload.correlation_id }}
      ZAS_NUM_A: ${{ inputs.num_a || github.event.client_payload.num_a }}
      ZAS_NUM_B: ${{ inputs.num_b || github.event.client_payload.num_b }}
      ZAS_CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show what ZAS sent us
        run: |
          echo "correlation_id : $ZAS_CORRELATION_ID"
          echo "num_a          : $ZAS_NUM_A"
          echo "num_b          : $ZAS_NUM_B"

      - name: Agent 1 - Add
        working-directory: new_agents/agents
        run: python3 agent1_add.py

      - name: Agent 2 - Classify
        working-directory: new_agents/agents
        run: python3 agent2_classify.py

      # How the result gets back to the adapter: it is uploaded here and the
      # adapter downloads it over the API. No inbound connection required.
      - name: Publish result for ZAS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zas-result
          path: ${{ github.workspace }}/.zas_work/result.json
          if-no-files-found: warn

      # Optional legacy path -- only fires when a callback_url was supplied.
      - name: Callback to ZAS (legacy)
        if: always() && env.ZAS_CALLBACK_URL != ''
        working-directory: new_agents/agents
        run: python3 post_callback.py
